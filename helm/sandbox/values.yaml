image:
  registry: ghcr.io/timerbulatov101-ship-it
  tag: latest
  pullPolicy: Always

backend:
  name: sandbox-backend
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  name: sandbox-frontend
  replicas: 1
  port: 8080
  nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi