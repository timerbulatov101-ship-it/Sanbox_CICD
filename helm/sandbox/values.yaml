image:
  registry: ghcr.io/timerbulatov101-ship-it
  tag: latest
  pullPolicy: Always

backend:
  name: sandbox-backend
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  name: sandbox-frontend
  replicas: 1
  port: 8080
  nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

database:
  enabled: true
  name: sandbox-postgres
  image: postgres:15-alpine
  port: 5432
  user: postgres
  password: ""
  database: sandbox
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  className: nginx
  host: sandbox.your.domain
