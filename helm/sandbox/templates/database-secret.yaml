{{- if .Values.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.name }}-auth
  labels:
    app: {{ .Values.database.name }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ required "database.password must be set with --set-string database.password=..." .Values.database.password | quote }}
  POSTGRES_DB: {{ .Values.database.database | quote }}
{{- end }}
