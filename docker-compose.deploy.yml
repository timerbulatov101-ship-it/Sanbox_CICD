
services:
  backend:
    image: ${REPOSITORY_BACKEND}:${VERSION}
    container_name: sandbox-backend
    restart: unless-stopped
    expose:
      - "8081"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ${REPOSITORY_FRONTEND}:${VERSION}
    container_name: sandbox-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"

