
name: Sandbox CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия образов для повторного деплоя или отката"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.VERSION }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(date -u +%Y%m%d-%H%M%S)
          fi

          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          NEXUS_REPO_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          set -e

          test -n "$NEXUS_HOST" || {
            echo "NEXUS_HOST is missing"
            exit 1
          }

          test -n "$NEXUS_REPO_USER" || {
            echo "NEXUS_REPO_USER is missing"
            exit 1
          }

          test -n "$NEXUS_REPO_PASS" || {
            echo "NEXUS_REPO_PASS is missing"
            exit 1
          }

          if [[ "$NEXUS_HOST" == http://* || "$NEXUS_HOST" == https://* || "$NEXUS_HOST" == */* ]]; then
            echo "NEXUS_HOST must contain only host:port"
            exit 1
          fi

      - name: Configure Docker daemon for HTTP Nexus
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          sudo install -d /etc/docker

          sudo python3 - "$NEXUS_HOST" <<'PY'
          import json
          import os
          import sys

          path = "/etc/docker/daemon.json"
          nexus_host = sys.argv[1]

          if os.path.exists(path):
              with open(path) as f:
                  config = json.load(f)
          else:
              config = {}

          registries = set(config.get("insecure-registries", []))
          registries.add(nexus_host)
          config["insecure-registries"] = sorted(registries)

          temp_path = path + ".tmp"
          with open(temp_path, "w") as f:
              json.dump(config, f, indent=2)

          os.replace(temp_path, path)
          PY

          sudo systemctl restart docker
          docker info

      - name: Create BuildKit config
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          cat > buildkitd.toml <<EOF
          [registry."${NEXUS_HOST}"]
            http = true
            insecure = true
          EOF

          cat buildkitd.toml

      - name: Create BuildKit config
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          cat > buildkitd.toml <<EOF
          [registry."${NEXUS_HOST}"]
            http = true
            insecure = true
          EOF

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          config: ./buildkitd.toml

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_REPO_USER }}
          password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ secrets.NEXUS_HOST }}/timerbulatov-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy application
    needs:
      - version
      - test
      - build

    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          needs.test.result == 'success' &&
          needs.build.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs.test.result == 'skipped' &&
          needs.build.result == 'skipped'
        )
      )

    runs-on: ubuntu-latest
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_REPO_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          set -e

          for name in VM_HOST VM_USER VM_SSH_KEY VM_SSH_KNOWN_HOSTS DEPLOY_PATH NEXUS_HOST NEXUS_REPO_USER NEXUS_REPO_PASS; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

          if [[ "$DEPLOY_PATH" != /* ]]; then
            echo "DEPLOY_PATH must be an absolute path"
            exit 1
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Configure known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -F "$VM_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "VM_HOST is not present in VM_SSH_KNOWN_HOSTS"
            exit 1
          fi

      - name: Test SSH connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "echo SSH connection successful"

      - name: Prepare deployment files
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          VERSION: ${{ needs.version.outputs.version }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          set -e

          mkdir -p deploy/backend

          cat > deploy/.env <<EOF
          NEXUS_HOST=${NEXUS_HOST}
          REPOSITORY_BACKEND=${NEXUS_HOST}/timerbulatov-backend-docker/sandbox-backend
          REPOSITORY_FRONTEND=${NEXUS_HOST}/timerbulatov-frontend-docker/sandbox-frontend
          VERSION=${VERSION}
          APP_PORT=8080
          EOF

          printf '%s' "$APP_ENV_FILE" > deploy/backend/.env

          echo "Deployment version: $VERSION"

      - name: Copy deployment files
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          ssh "$VM_USER@$VM_HOST" \
            "mkdir -p '$DEPLOY_PATH/backend'"

          scp docker-compose.deploy.yml \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/docker-compose.yml"

          scp deploy/.env \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/.env"

          scp deploy/backend/.env \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/backend/.env"

      
      - name: Configure HTTP Nexus on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          set -e

          ssh "$VM_USER@$VM_HOST" \
            "sudo mkdir -p /etc/docker"

          ssh "$VM_USER@$VM_HOST" \
            "sudo python3 - '$NEXUS_HOST' <<'PY'
          import json
          import os
          import sys

          path = '/etc/docker/daemon.json'
          nexus_host = sys.argv[1]

          if os.path.exists(path):
              with open(path, 'r') as f:
                  config = json.load(f)
          else:
              config = {}

          registries = set(config.get('insecure-registries', []))
          registries.add(nexus_host)

          config['insecure-registries'] = sorted(registries)

          temp_path = path + '.tmp'

          with open(temp_path, 'w') as f:
              json.dump(config, f, indent=2)

          os.replace(temp_path, path)
          PY
          sudo systemctl restart docker"

          ssh "$VM_USER@$VM_HOST" \
            "sudo docker info"


      - name: Login to Nexus on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_REPO_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          set -e

          PASS_B64=$(printf '%s' "$NEXUS_REPO_PASS" | base64 -w 0)
          USER_B64=$(printf '%s' "$NEXUS_REPO_USER" | base64 -w 0)

          ssh "$VM_USER@$VM_HOST" \
            "printf '%s' '$PASS_B64' | base64 -d | docker login '$NEXUS_HOST' \
            --username \"\$(printf '%s' '$USER_B64' | base64 -d)\" \
            --password-stdin"

      - name: Deploy with Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          ssh "$VM_USER@$VM_HOST" \
            "cd '$DEPLOY_PATH' && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            docker image prune -f"

      - name: Verify deployment
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "cd '$DEPLOY_PATH' && docker compose ps"
