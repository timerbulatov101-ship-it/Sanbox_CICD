
name: Sandbox CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия образов"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.VERSION }}
        run: |
          set -e

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(date -u +%Y%m%d-%H%M%S)
          fi

          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend builder
        run: |
          docker build \
            --target builder \
            -t sandbox-backend-builder:ci \
            ./backend

      - name: Run tests
        run: |
          set -e
          mkdir -p reports

          docker run --rm \
            -v "$PWD/reports:/reports" \
            sandbox-backend-builder:ci \
            sh -c '
              go install github.com/jstemmer/go-junit-report/v2@v2.1.0

              set +e
              CGO_ENABLED=0 go test -v -coverprofile=/reports/coverage.out ./... > /reports/test.log 2>&1
              rc=$?
              set -e

              "$(go env GOPATH)/bin/go-junit-report" < /reports/test.log > /reports/junit.xml

              if [ -f /reports/coverage.out ]; then
                go tool cover -func=/reports/coverage.out > /reports/coverage.txt
              fi

              exit $rc
            '

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: warn

  build:
    name: Build and publish ${{ matrix.component }}
    needs:
      - version
      - test

    runs-on: ubuntu-latest

    concurrency:
      group: build-${{ github.ref }}-${{ matrix.component }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend

          test -n "$NEXUS_REPO_USER" || {
            echo "NEXUS_REPO_USER is missing"
            exit 1
          }

      # Nexus configuration is disabled.
      #
      # - name: Validate Nexus configuration
      #   env:
      #     NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      #     NEXUS_REPO_USER: ${{ secrets.NEXUS_REPO_USER }}
      #     NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
      #   run: |
      #     set -e
      #     test -n "$NEXUS_HOST"
      #     test -n "$NEXUS_REPO_USER"
      #     test -n "$NEXUS_REPO_PASS"

      # HTTP Nexus configuration is disabled.
      #
      # - name: Configure Docker daemon for HTTP Nexus
      #   env:
      #     NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      #   run: |
      #     sudo install -d /etc/docker
      #     sudo python3 - "$NEXUS_HOST" <<'PY'
      #     import json
      #     import os
      #     import sys
      #
      #     path = "/etc/docker/daemon.json"
      #     nexus_host = sys.argv[1]
      #
      #     if os.path.exists(path):
      #         with open(path) as f:
      #             config = json.load(f)
      #     else:
      #         config = {}
      #
      #     registries = set(config.get("insecure-registries", []))
      #     registries.add(nexus_host)
      #     config["insecure-registries"] = sorted(registries)
      #
      #     with open(path, "w") as f:
      #         json.dump(config, f, indent=2)
      #     PY
      #
      #     sudo systemctl restart docker

      # BuildKit Nexus configuration is disabled.
      #
      # - name: Create BuildKit config
      #   env:
      #     NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      #   run: |
      #     cat > buildkitd.toml <<EOF
      #     [registry."${NEXUS_HOST}"]
      #       http = true
      #       insecure = true
      #     EOF

      - name: Create BuildKit config
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          cat > buildkitd.toml <<EOF
          [registry."${NEXUS_HOST}"]
            http = true
            insecure = true
          EOF

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nexus login is disabled.
      #
      # - name: Login to Nexus
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.NEXUS_HOST }}
      #     username: ${{ secrets.NEXUS_REPO_USER }}
      #     password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      # Nexus image destination is disabled.
      #
      # Previous Nexus image:
      # ${{ secrets.NEXUS_HOST }}/timerbulatov-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

