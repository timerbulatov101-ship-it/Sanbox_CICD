
name: Sandbox CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия образов для повторного деплоя или отката"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.VERSION }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(date -u +%Y%m%d-%H%M%S)
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

  build:
    name: Build and publish ${{ matrix.component }}
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create BuildKit config
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          if [[ "$NEXUS_HOST" == http://* || "$NEXUS_HOST" == https://* || "$NEXUS_HOST" == */* ]]; then
            echo "NEXUS_HOST must contain only host:port"
            exit 1
          fi

          cat > buildkitd.toml <<EOF
          [registry."${NEXUS_HOST}"]
            http = true
            insecure = true
          EOF

          cat buildkitd.toml

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          config: ./buildkitd.toml

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_REPO_USER }}
          password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ secrets.NEXUS_HOST }}/timerbulatov-backend-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy application
    needs:
      - version
      - build
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' &&
      (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Configure known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment files
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          VERSION: ${{ needs.version.outputs.version }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          mkdir -p deploy/backend

          cat > deploy/.env <<EOF
          NEXUS_HOST=${NEXUS_HOST}
          REPOSITORY_BACKEND=${NEXUS_HOST}/timerbulatov-backend-docker/sandbox-backend
          REPOSITORY_FRONTEND=${NEXUS_HOST}/timerbulatov-frontend-docker/sandbox-frontend
          VERSION=${VERSION}
          APP_PORT=8080
          EOF

          printf '%s' "$APP_ENV_FILE" > deploy/backend/.env

          echo "Deployment version: $VERSION"

      - name: Copy deployment files
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$VM_USER@$VM_HOST" "mkdir -p '$DEPLOY_PATH/backend'"

          scp docker-compose.deploy.yml \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/docker-compose.yml"

          scp deploy/.env \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/.env"

          scp deploy/backend/.env \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/backend/.env"

      - name: Configure HTTP Nexus on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "sudo python3 -c 'import json,os,sys; p=\"/etc/docker/daemon.json\"; d=json.load(open(p)) if os.path.exists(p) else {}; a=set(d.get(\"insecure-registries\", [])); a.add(sys.argv[1]); d[\"insecure-registries\"]=sorted(a); json.dump(d,open(p,\"w\"))' '$NEXUS_HOST' && sudo systemctl restart docker"

      - name: Login to Nexus on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_REPO_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          printf '%s' "$NEXUS_REPO_PASS" | ssh "$VM_USER@$VM_HOST" \
            "docker login '$NEXUS_HOST' --username '$NEXUS_REPO_USER' --password-stdin"

      - name: Deploy with Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "cd '$DEPLOY_PATH' && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            docker image prune -f"
