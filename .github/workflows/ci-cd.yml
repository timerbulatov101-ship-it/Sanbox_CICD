name: Sandbox CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "1.0.${{ github.run_number }}"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: |
          if node -e "const s=require('./package.json').scripts || {}; process.exit(s['test:unit'] || s.test ? 0 : 1)"; then
            if node -e "const s=require('./package.json').scripts || {}; process.exit(s['test:unit'] ? 0 : 1)"; then
              npm run test:unit
            else
              npm test -- --runInBand
            fi
          else
            echo "No frontend test script configured. Skipping."
          fi

  build:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image owner
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Nexus
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_REPO_USER }}
          password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sandbox-backend:${{ env.VERSION }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sandbox-backend:${{ github.sha }}
            ${{ secrets.NEXUS_HOST }}/sandbox-backend:${{ env.VERSION }}
            ${{ secrets.NEXUS_HOST }}/sandbox-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            VUE_APP_API_URL=${{ vars.APP_API_URL }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sandbox-frontend:${{ env.VERSION }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sandbox-frontend:${{ github.sha }}
            ${{ secrets.NEXUS_HOST }}/sandbox-frontend:${{ env.VERSION }}
            ${{ secrets.NEXUS_HOST }}/sandbox-frontend:${{ github.sha }}

  deploy:
    name: Deploy application
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Configure known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment files
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          mkdir -p deploy/backend

          cat > deploy/.env <<EOF
          NEXUS_HOST=${NEXUS_HOST}
          VERSION=${VERSION}
          APP_PORT=8080
          EOF

          printf '%s' "$APP_ENV_FILE" > deploy/backend/.env

      - name: Copy files to server
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$VM_USER@$VM_HOST" "mkdir -p '$DEPLOY_PATH/backend'"

          scp docker-compose.deploy.yml \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/docker-compose.yml"

          scp deploy/.env \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/.env"

          scp deploy/backend/.env \
            "$VM_USER@$VM_HOST:$DEPLOY_PATH/backend/.env"

      - name: Login to GHCR on remote server
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GHCR_PAT" | ssh "$VM_USER@$VM_HOST" \
            "docker login ghcr.io \
            --username '$GHCR_USERNAME' --password-stdin"

      - name: Login to Nexus on remote server
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_REPO_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_REPO_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          printf '%s' "$NEXUS_REPO_PASS" | ssh "$VM_USER@$VM_HOST" \
            "docker login '$NEXUS_HOST' \
            --username '$NEXUS_REPO_USER' --password-stdin"

      - name: Deploy with Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "cd '$DEPLOY_PATH' && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            docker image prune -f"
